[project]
name = "talk-to-our-team"
version = "0.1.0"
description = "A GPT-Live inbound SDR with a simulated calendar and guarded bookings."
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[openai,silero]==1.8.5",
  "python-dotenv>=1.0,<2",
  "voicegateway[livekit]==0.27.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
