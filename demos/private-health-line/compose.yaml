# The model server: run on one GPU machine (24 GB is plenty) with the NVIDIA
# container toolkit. Only Caddy is published; it terminates TLS and routes
# speech to speaches and chat to vLLM. Both check the same bearer key.
#   ONPREM_DOMAIN=models.example.ca ONPREM_API_KEY=... docker compose up -d
services:
  speech:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped
    environment:
      API_KEY: ${ONPREM_API_KEY:?set ONPREM_API_KEY}
      PRELOAD_MODELS: '["deepdml/faster-whisper-large-v3-turbo-ct2","speaches-ai/Kokoro-82M-v1.0-ONNX"]'
      # Keep both models in GPU memory: a cold load would land on a caller's first turn.
      STT_MODEL_TTL: -1
      TTS_MODEL_TTL: -1
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  llm:
    image: vllm/vllm-openai:v0.10.2
    restart: unless-stopped
    command:
      - --model=Qwen/Qwen3-4B-Instruct-2507
      - --api-key=${ONPREM_API_KEY:?set ONPREM_API_KEY}
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --max-model-len=8192
      # Leave room on the card for Whisper and Kokoro.
      - --gpu-memory-utilization=0.55
    ipc: host
    volumes:
      - llm-models:/root/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      ONPREM_DOMAIN: ${ONPREM_DOMAIN:?set ONPREM_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [speech, llm]

volumes:
  speech-models:
  llm-models:
  caddy-data:
