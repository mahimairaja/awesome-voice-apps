[project]
name = "demo-evals"
version = "0.1.0"
description = "Voice evals for the hosted playground demos, run with DeepEval."
requires-python = ">=3.11"
dependencies = [
    "deepeval==4.2.8",
    "livekit>=1.0,<2.0",
    "kokoro-onnx>=0.4,<0.6",
    "faster-whisper>=1.1,<2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false
