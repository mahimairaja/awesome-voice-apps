name: SDR state tests
on:
  pull_request:
    paths:
      - 'demos/talk-to-our-team/**'
      - '.github/workflows/sdr-tests.yml'
  push:
    branches: [main]
    paths:
      - 'demos/talk-to-our-team/**'
      - '.github/workflows/sdr-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --project demos/talk-to-our-team --python 3.11 --locked
      - run: uv run --project demos/talk-to-our-team --locked pytest demos/talk-to-our-team -q
