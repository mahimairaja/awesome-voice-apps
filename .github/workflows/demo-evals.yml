name: Demo evals

# Calls the hosted playground demos with a scripted caller and scores each call
# with DeepEval's local voice metrics. Results go to mahimai.ca. Each call is
# paid from the site's capped eval budget, so only maintainers can start one:
# on a schedule, by hand, or after a change that redeploys the demo worker.
on:
  schedule:
    - cron: "0 14 1,15 * *"
  push:
    branches: [main]
    paths: ["demos/**", "playground/**", "deployment/**"]
  workflow_dispatch:
    inputs:
      demos:
        description: "Comma-separated demo ids (empty runs every scenario)"
        required: false
        default: ""
      models:
        description: 'Models for switchable demos, as JSON: {"stt": "...", "llm": "...", "tts": "..."} (empty runs the defaults)'
        required: false
        default: ""
      site:
        description: "Site to call: https://mahimai.ca (default) or one of its workers.dev previews"
        required: false
        default: ""
      judge_only:
        description: "Only judge the calls already recorded (no new calls)"
        type: boolean
        required: false
        default: false
  pull_request:
    paths: ["tests/evals/**", ".github/workflows/demo-evals.yml"]

permissions:
  contents: read

concurrency:
  group: demo-evals-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  KOKORO_URL: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0

jobs:
  harness:
    name: harness (offline)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/evals
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tests/evals/uv.lock
      - name: Cache caller voice
        uses: actions/cache@v4
        with:
          path: tests/evals/.models
          key: kokoro-v1.0-int8
      - name: Download caller voice
        run: |
          mkdir -p .models
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do
            [ -f ".models/$f" ] || curl -fsSL -o ".models/$f" "$KOKORO_URL/$f"
          done
      - run: uv sync --locked
      - run: uv run pytest test_harness.py -q

  live:
    name: live demos
    if: github.event_name != 'pull_request' && github.repository == 'mahimairaja/awesome-voice-apps' && !inputs.judge_only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tests/evals
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tests/evals/uv.lock
      - name: Cache caller voice
        uses: actions/cache@v4
        with:
          path: tests/evals/.models
          key: kokoro-v1.0-int8
      - name: Download caller voice
        run: |
          mkdir -p .models
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do
            [ -f ".models/$f" ] || curl -fsSL -o ".models/$f" "$KOKORO_URL/$f"
          done
      - run: uv sync --locked
      - name: Wait for the worker redeploy
        if: github.event_name == 'push'
        run: sleep 600
      - name: Run evals
        env:
          PLAYGROUND_EVAL_SECRET: ${{ secrets.PLAYGROUND_EVAL_SECRET }}
          EVAL_DEMOS: ${{ inputs.demos }}
          EVAL_MODELS: ${{ inputs.models }}
          EVAL_SITE: ${{ inputs.site }}
          EVAL_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          EVAL_AUDIO_DIR: recordings
        run: uv run deepeval test run test_demos.py --identifier "gh-${{ github.run_id }}"
      # The call audio, to listen to what the scores describe. Synthetic callers
      # and demo agents only, kept a week.
      - name: Keep the call audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-recordings-${{ github.run_id }}
          path: tests/evals/recordings/
          retention-days: 7
          if-no-files-found: ignore

  judge:
    # Claude reads each new call's transcript and tools and scores goal, relevance,
    # tool use and policy (tests/evals/JUDGE.md) through the Claude API. The script
    # fetches and posts; the model only sees the call it judges.
    name: judge calls
    needs: live
    if: >-
      always() && github.repository == 'mahimairaja/awesome-voice-apps' &&
      (needs.live.result == 'success' || needs.live.result == 'failure' || inputs.judge_only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    defaults:
      run:
        working-directory: tests/evals
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tests/evals/uv.lock
      - run: uv sync --locked
      # The Claude API judge when the repository has ANTHROPIC_API_KEY; until then
      # Claude Code on the maintainer's subscription, as before.
      - name: Judge with the Claude API
        if: env.HAS_API_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAYGROUND_EVAL_SECRET: ${{ secrets.PLAYGROUND_EVAL_SECRET }}
        run: uv run python judge_claude.py
      - name: Fetch pending calls
        if: env.HAS_API_KEY != 'true'
        env:
          PLAYGROUND_EVAL_SECRET: ${{ secrets.PLAYGROUND_EVAL_SECRET }}
        run: python3 judge_api.py pending > pending.json
      - name: Judge with Claude Code
        if: env.HAS_API_KEY != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          npx --yes @anthropic-ai/claude-code@2.1.283
          -p "Follow JUDGE_CLI.md to judge the calls in pending.json."
          --model claude-sonnet-4-6
          --output-format json
          --allowedTools Read
          --disallowedTools "Bash,Edit,Write,WebFetch,WebSearch"
          > judged.json
      - name: Post scores
        if: env.HAS_API_KEY != 'true'
        env:
          PLAYGROUND_EVAL_SECRET: ${{ secrets.PLAYGROUND_EVAL_SECRET }}
        run: python3 judge_api.py post judged.json
