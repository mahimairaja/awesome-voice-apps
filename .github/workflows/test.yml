name: Tests

on:
  workflow_dispatch:

jobs:
  eval:
    name: eval / ${{ matrix.demo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo:
          - clinic-scheduler
          - drive-thru-coffee
          - quick-trivia
          - water-tracker
          - roadside-dispatch
          - tenant-rights
          - claim-intake
          - panel-scribe
          - pharmacy-refill
          - furnace-repair
          - fair-cancellation
          - pronunciation-coach
          - postop-checkin
          - returning-caller
          - support-cost-router
          - payer-verification
          - loan-callback
          - private-health-line
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: demos/${{ matrix.demo }}/uv.lock

      - name: Sync demo
        run: uv --project demos/${{ matrix.demo }} sync

      - name: Run evals with coverage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          RIME_API_KEY: ${{ secrets.RIME_API_KEY }}
          PYANNOTE_API_KEY: ${{ secrets.PYANNOTE_API_KEY }}
        run: >
          uv --project demos/${{ matrix.demo }} run
          --with pytest --with pytest-asyncio --with pytest-cov
          python -m pytest tests/${{ matrix.demo }}
          --cov=demos/${{ matrix.demo }} --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ matrix.demo }}
          fail_ci_if_error: false
