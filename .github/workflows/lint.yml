name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: ruff + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: ruff format
        run: uvx ruff==0.15.16 format --check .

      - name: ruff check
        run: uvx ruff==0.15.16 check .

      - name: Compile examples
        run: python -m compileall -q demos templates
